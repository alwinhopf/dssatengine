[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatengine"
version = "0.4.1"
description = "Canonical DSSAT crop-modeling gridded engine package"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alwin Hopf" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    "rasterio>=1.3",
    "xarray>=2024.6",
    "netCDF4>=1.6",
    "requests>=2.32",
    "tqdm>=4.66",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
