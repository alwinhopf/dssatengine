name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest -q

  r:
    name: R (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        # Authenticate GitHub package resolution explicitly instead of relying
        # on an anonymous API request or a package manager fallback token.
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::testthat, any::pkgload, github::alwinhopf/dssatutils@e9c859fa1d915623df23e2eb13084cb085dbfe3e
          needs: check
          # This package has no R Markdown/Quarto documentation. The action's
          # automatic Pandoc probe resolves all Suggests/Imports a second time
          # but loses the GitHub package reference supplied above.
          install-pandoc: false
      - name: Run R tests
        shell: Rscript {0}
        run: |
          pkgload::load_all('.', quiet = TRUE)
          testthat::test_dir('tests/testthat', reporter = 'summary', stop_on_failure = TRUE)
