name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  fast-unit:
    name: Fast Unit (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest tests -v --junit-xml=test-results.xml

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-unit-python-results
          path: test-results.xml

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::testthat, any::pkgload, github::alwinhopf/dssatutils@a4202fbc6377a62b391340c317c92c96d157e031
          needs: check
          install-pandoc: false

      - name: Run R tests
        shell: Rscript {0}
        run: |
          pkgload::load_all('.', quiet = TRUE)
          testthat::test_dir('tests/testthat', reporter = 'summary', stop_on_failure = TRUE)

  platform-compat:
    name: Platform Compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest tests -v --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-compat-${{ matrix.os }}-results
          path: test-results.xml
