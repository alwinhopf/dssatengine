name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  fast-unit:
    name: Fast Unit (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: bash scripts/pre-push.sh
        shell: bash

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fast-unit-python-results
          path: |
            test-results.xml
            fast-tests.log

  language-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          extra-packages: any::testthat, any::pkgload, github::alwinhopf/dssatutils@f728cd810923465360e4730d8893bb566dc0773c
          needs: check
          install-pandoc: false

      - name: Run R tests
        shell: bash
        run: >-
          "$(command -v Rscript)" --vanilla -e
          'pkgload::load_all(".", quiet=TRUE);
          testthat::test_dir("tests/testthat", reporter="summary", stop_on_failure=TRUE)'
          2>&1 | tee r-tests.log

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: r-parity-logs
          path: '*.log'
          if-no-files-found: ignore

  platform-compat:
    name: Platform Compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: bash scripts/pre-push.sh
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-compat-${{ matrix.os }}-results
          path: |
            test-results.xml
            fast-tests.log
